# Every test gets a wall-clock budget so a stuck game loop can never hang the whole build (the
# frame loop and the resource-loading thread are the two places a test can block indefinitely).
# The budget is far above the slowest real test (the full asset boot + 600 frames, ~30 s), so a
# test only fails here when it is actually stuck. Timeout mode is SEPARATE_THREAD: a test stuck in
# a non-interruptible loop is abandoned (and fails with a clear message) instead of
# interrupting/hanging the caller thread.
junit.jupiter.execution.timeout.default = 180 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
