[versions]
lwjgl = "3.4.3"
junit = "6.1.3"
# The real Fabric Loader (Fabric maven only, not Maven Central). The game's own code never depends on
# it, but its test fixtures do: they are mods, and they are launched through the loader. The game
# provider of the game project (cn.enaium.fabricpvz.provider) compiles against it too.
fabric-loader = "0.19.5"
# Mixin, as shipped with that loader (see fabric-loader-0.19.5.json, "libraries").
sponge-mixin = "0.17.4+mixin.0.8.7"
# ASM, as shipped with that loader. 9.10.x is required because the port's classes are Java 25
# (class file major version 69) and older ASM releases cannot read them.
asm = "9.10.1"
# The Log4j backend of the one logging stack: the game logs through the SLF4J API below and the
# launch libraries bind it to Log4j (log4j-slf4j2-impl), configured by the log4j2.xml this project
# ships as a resource, so every launch path has exactly one binding and one configuration.
log4j = "2.26.1"
# The SLF4J API the game logs through. Deliberately only the API: the implementation (Log4j) and its
# configuration are the launch libraries', which puts the whole stack on the runtime class path, so
# every launch path has exactly one binding and one log4j2.xml. The version matches the Log4j
# stack's slf4j-api so the game and the stack it runs on resolve to one slf4j-api jar.
slf4j = "2.0.20"

[libraries]
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
lwjgl-core = { module = "org.lwjgl:lwjgl" }
lwjgl-sdl = { module = "org.lwjgl:lwjgl-sdl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl" }
lwjgl-openal = { module = "org.lwjgl:lwjgl-openal" }
lwjgl-stb = { module = "org.lwjgl:lwjgl-stb" }
lwjgl-nfd = { module = "org.lwjgl:lwjgl-nfd" }
lwjgl-tinyfd = { module = "org.lwjgl:lwjgl-tinyfd" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
sponge-mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "sponge-mixin" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
