[versions]
lwjgl = "3.4.3"
junit = "6.1.3"
# The real Fabric Loader (Fabric maven only, not Maven Central). The game's own code never depends on
# it, but its test fixtures do: they are mods, and they are launched through the loader.
fabric-loader = "0.19.5"
# The SLF4J API the game logs through. Deliberately only the API: the implementation (Log4j) and its
# configuration are the provider's, which publishes the whole stack as a launch library, so every
# launch path has exactly one binding and one log4j2.xml. The version matches the provider's so the
# game and the stack it runs on resolve to one slf4j-api jar.
slf4j = "2.0.20"

[libraries]
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
lwjgl-core = { module = "org.lwjgl:lwjgl" }
lwjgl-sdl = { module = "org.lwjgl:lwjgl-sdl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl" }
lwjgl-openal = { module = "org.lwjgl:lwjgl-openal" }
lwjgl-stb = { module = "org.lwjgl:lwjgl-stb" }
lwjgl-nfd = { module = "org.lwjgl:lwjgl-nfd" }
lwjgl-tinyfd = { module = "org.lwjgl:lwjgl-tinyfd" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
